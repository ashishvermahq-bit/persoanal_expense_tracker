# Paisa on one VM: the app + MongoDB + an hourly job runner, behind nginx on the host.
#   cd deploy && cp .env.example .env   # fill it in
#   docker compose up -d --build
# Only nginx (on the host) can reach the app: it listens on 127.0.0.1 only.
# MongoDB has no published port at all.
name: paisa

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in deploy/.env}
      # Used once, on first start, by mongo-init/01-app-user.js to create the app's own user.
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD in deploy/.env}
    volumes:
      - mongo-data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: paisa-app:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      # Least-privilege user (readWrite on `paisa` only), created by mongo-init.
      MONGODB_URI: mongodb://paisa:${MONGO_APP_PASSWORD}@mongo:27017/paisa?authSource=paisa
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env}
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in deploy/.env}
      APP_URL: ${APP_URL:?set APP_URL in deploy/.env}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Next finishes in-flight requests and after() work (reset emails) on SIGTERM.
    stop_grace_period: 30s

  # Generates due recurring entries and deletes orphan receipts. Runs are idempotent,
  # so hourly just means entries appear soon after midnight IST and after any downtime.
  jobs:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CRON_SECRET: ${CRON_SECRET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
        curl -fsS -m 120 -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/recurring || echo "recurring job failed";
        echo; sleep 3600;
        done

volumes:
  mongo-data:
