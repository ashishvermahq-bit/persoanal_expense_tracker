# nginx site for Paisa. Copy to /etc/nginx/sites-available/paisa, link it into
# sites-enabled, replace every paisa.example.com and the two certificate paths,
# then: sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS is required, not optional: the session cookie is marked Secure, so over
# plain http:// browsers drop it and sign-in silently fails.

upstream paisa_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name paisa.example.com;

    # Let's Encrypt HTTP challenge (certbot --webroot -w /var/www/html)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.25.1+ prefers `listen 443 ssl;` plus `http2 on;` (this form still works, with a warning).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paisa.example.com;

    ssl_certificate     /etc/letsencrypt/live/paisa.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paisa.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:paisa_ssl:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # The app caps receipts at 4 MB and bank statements at 1 MB; leave room for form overhead.
    client_max_body_size 6m;

    location / {
        proxy_pass http://paisa_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # The app checks Origin against these (CSRF), so they must be the public host.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Set, never appended: the app rate-limits sign-in by client IP, so a client
        # must not be able to supply its own value.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        # Exports and the job runner can take a while on a slow VM.
        proxy_read_timeout 120s;
    }
}
